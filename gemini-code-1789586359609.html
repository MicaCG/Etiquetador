<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Etiquetas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      margin-bottom: 25px;
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #555;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .results {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 4px;
      background: #fff;
    }
    .result-item {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }
    .result-item:hover {
      background-color: #f0f7ff;
    }
    button {
      background-color: #111;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #333;
    }

    /* Formato de la etiqueta */
    .label-container {
      background-color: white;
      border: 1px solid #ccc;
      padding: 12px;
      width: 320px; /* Ajustable a las dimensiones reales en mm o px */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sku-box {
      border: 1.5px solid #000;
      padding: 10px 6px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .name-box {
      border: 1.5px solid #000;
      padding: 16px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      text-transform: uppercase;
      white-space: pre-line;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Reglas de Impresión */
    @media print {
      body * {
        visibility: hidden;
      }
      .label-container, .label-container * {
        visibility: visible;
      }
      .label-container {
        position: absolute;
        left: 0;
        top: 0;
        border: none;
        padding: 0;
      }
      @page {
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="panel">
    <h2>1. Búsqueda de Producto</h2>
    <div class="field">
      <label for="search">Buscar por SKU o Nombre:</label>
      <input type="text" id="search" placeholder="Ej. PMU-056-4 o POPU..." oninput="handleSearch()">
      <div id="results" class="results" style="display: none;"></div>
    </div>

    <div class="field">
      <label>O cargar archivo CSV (columnas: SKU, Nombre):</label>
      <input type="file" id="csvFile" accept=".csv" onchange="loadCSV(event)">
    </div>

    <button onclick="window.print()">Imprimir Etiqueta</button>
  </div>

  <!-- Vista previa de la Etiqueta -->
  <div class="label-container" id="label">
    <div class="sku-box" id="lbl-sku">PMU-056-4</div>
    <div class="name-box" id="lbl-name">KIT PMU POPU PROFESIONAL&#10;3.0 MM BLACK</div>
  </div>

  <script>
    // Catálogo de ejemplo inicial
    let products = [
      { sku: "PMU-056-4", name: "KIT PMU POPU PROFESIONAL\n3.0 MM BLACK" },
      { sku: "PMU-056-5", name: "KIT PMU POPU PROFESIONAL\n4.0 MM RED" },
      { sku: "EZ-FLT-X40", name: "MAQUINA PEN TATTOO INALAMBRICA\nEZ-FILTER X40" }
    ];

    function handleSearch() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const resultsDiv = document.getElementById('results');
      if (!q) {
        resultsDiv.style.display = 'none';
        return;
      }
      const matches = products.filter(p => 
        p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
      );
      if (matches.length === 0) {
        resultsDiv.innerHTML = '<div class="result-item" style="color: #888;">Sin coincidencias</div>';
      } else {
        resultsDiv.innerHTML = matches.map((p, idx) => `
          <div class="result-item" onclick="selectProduct(${idx})">
            <strong>${p.sku}</strong> — ${p.name.replace(/\n/g, ' ')}
          </div>
        `).join('');
      }
      resultsDiv.style.display = 'block';
    }

    function selectProduct(index) {
      const p = products[index];
      document.getElementById('lbl-sku').textContent = p.sku;
      document.getElementById('lbl-name').textContent = p.name;
      document.getElementById('search').value = `${p.sku} - ${p.name.replace(/\n/g, ' ')}`;
      document.getElementById('results').style.display = 'none';
    }

    function loadCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const lines = evt.target.result.split('\n');
        products = [];
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const parts = line.split(',');
          if (parts.length >= 2) {
            products.push({
              sku: parts[0].trim(),
              name: parts.slice(1).join(',').trim().replace(/;/g, '\n')
            });
          }
        }
        alert(`Se cargaron ${products.length} productos con éxito.`);
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
